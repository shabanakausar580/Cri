name: ptv-sports2

on:
  workflow_dispatch:

jobs:
  ptv-sports2:
    runs-on: ubuntu-latest
    environment: Cricket
    permissions:
      actions: write
      contents: read

    steps:
      - name: Update system packages
        run: sudo apt update
        
      - name: Install system dependencies
        run: |
          sudo apt install -y \
            dos2unix \
            git \
            torsocks \
            inotify-tools \
            curl \
            wget \
            jq \
            software-properties-common \
            apt-transport-https \
            ca-certificates \
            gnupg \
            lsb-release \
            ffmpeg
        
      - name: Add NodeJS 22.x repository
        run: curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash
        
      - name: Install NodeJS
        run: sudo apt install -y nodejs
        
      - name: Verify Node.js and npm installation
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
        
      - name: Download Cloudflare Tunnel
        run: curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

      - name: Install Cloudflare Tunnel
        run: sudo dpkg -i cloudflared.deb && rm -f cloudflared.deb
        
      - name: Install Flussonic
        run: |
          curl -sSf http://apt.flussonic.com/binary/gpg.key | sudo tee /etc/apt/trusted.gpg.d/flussonic.gpg > /dev/null
          sudo rm -f /etc/apt/sources.list.d/erlyvideo.list
          echo "deb http://apt.flussonic.com binary/" | sudo tee /etc/apt/sources.list.d/flussonic.list
          sudo apt update
          sudo apt-get -y --install-recommends install flussonic
        
      - name: Install Playwright system dependencies
        run: yes | sudo npx playwright install-deps || true
        
      - name: Install Node.js packages
        run: sudo npm install @playwright/test axios cheerio playwright recaptcha-solver chokidar puppeteer adm-zip wrangler@latest
        
      - name: Install Playwright browsers (as root for sudo bash script)
        run: yes | sudo npx playwright install || true
      
      - name: Download remote bash file
        run: wget "${{ secrets.CRICKET_PORTAL_URL }}/ptv-sports2.sh" || echo "Primary URL download failed"
        
      - name: Check if bash file exists and download from backup if not
        run: |
          if [ ! -f ptv-sports2.sh ]; then
            echo "Primary URL file not found, downloading from backup URL"
            wget "${{ secrets.CRICKET_BACKUP_BASH_URL }}/ptv-sports2.sh"
          else
            echo "Bash file downloaded successfully"
          fi

      - name: Fix line endings in bash file
        run: sudo dos2unix ptv-sports2.sh || true
        
      - name: Set bash file permissions
        run: |
          sudo chmod +x ptv-sports2.sh
          sudo chmod 777 ptv-sports2.sh
        
      - name: Cleanup Failed and Cancelled Workflow Runs
        env:
          GITHUB_TOKEN: ${{ secrets.API_KEY || secrets.GITHUB_TOKEN }}
        run: |
          node <<'EOF'
          const axios = require('axios');

          const GITHUB_TOKEN = process.env.GITHUB_TOKEN;
          const OWNER = process.env.GITHUB_REPOSITORY.split('/')[0];
          const REPO = process.env.GITHUB_REPOSITORY.split('/')[1];

          // GitHub API requires 'token' prefix for personal access tokens
          const headers = {
            Authorization: `token ${GITHUB_TOKEN}`,
            Accept: 'application/vnd.github.v3+json',
          };

          async function cleanupWorkflows() {
            try {
              // Validate token exists
              if (!GITHUB_TOKEN || GITHUB_TOKEN === '') {
                console.error('Error: GITHUB_TOKEN is not set');
                return;
              }

              console.log(`Starting cleanup for ${OWNER}/${REPO}...`);
              
              let page = 1;
              let hasMore = true;
              let totalDeleted = 0;

              while (hasMore) {
                const response = await axios.get(
                  `https://api.github.com/repos/${OWNER}/${REPO}/actions/runs`,
                  { headers, params: { per_page: 100, page } }
                );

                const runs = response.data.workflow_runs;

                const runsToDelete = runs.filter(
                  (run) => run.conclusion === 'cancelled' || run.conclusion === 'failure'
                );

                console.log(`Page ${page}: Found ${runsToDelete.length} runs to delete`);

                for (const run of runsToDelete) {
                  try {
                    console.log(`Deleting workflow run: ${run.id} (${run.conclusion})`);
                    await axios.delete(
                      `https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${run.id}`,
                      { headers }
                    );
                    totalDeleted++;
                  } catch (deleteError) {
                    console.warn(`Failed to delete run ${run.id}:`, deleteError.response?.data?.message || deleteError.message);
                  }
                }

                hasMore = runs.length === 100;
                page++;
              }

              console.log(`Cleanup completed successfully. Deleted ${totalDeleted} workflow runs.`);
            } catch (error) {
              console.error('Error during cleanup:', error.response?.data || error.message);
              // Don't fail the workflow if cleanup fails
              process.exit(0);
            }
          }

          cleanupWorkflows();
          EOF
          
      - name: Run the bash script
        run: sudo xvfb-run -a bash ptv-sports2.sh
        
  trigger_workflow:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Sleep for 5 hours and 58 minutes
        run: sleep $((5*3600 + 58*60))
        
      - name: Trigger new workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.API_KEY }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ptv-sports2.yml/dispatches \
            -d '{"ref":"main"}'
